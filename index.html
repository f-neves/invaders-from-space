<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#05060a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Invaders from Space</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <meta name="description" content="Shoot'em up vertical em Canvas 2D, com HUD próprio para celular e para computador." />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div id="app">
      <div id="frame">
        <!-- HUD: barra do gabinete no desktop, sobreposição no topo no mobile -->
        <header id="hud">
          <div class="hud-block">
            <span class="hud-label">SCORE</span>
            <span class="hud-value" id="scoreEl">00000</span>
          </div>
          <div class="hud-block hud-block--end">
            <span class="hud-label">RECORDE</span>
            <span class="hud-value hud-value--dim" id="bestEl">00000</span>
          </div>
        </header>

        <div id="stage">
          <div id="screen">
            <canvas id="game"></canvas>

            <!-- todas as telas de menu vivem aqui, uma visível por vez -->
            <div id="panel" data-view="menu">
              <section class="screen" data-screen="menu">
                <h1 class="title">
                  <span class="title-top">INVADERS</span>
                  <span class="title-bottom">FROM SPACE</span>
                </h1>
                <div class="menu-list">
                  <button class="item item--go" data-nav data-action="play">
                    JOGAR
                  </button>
                  <button class="item" data-nav data-action="options">
                    OPÇÕES
                  </button>
                  <button class="item" data-nav data-action="scores">
                    RECORDES
                  </button>
                </div>
                <p class="foot">
                  <span id="menuDifficulty">NORMAL</span>
                  <span class="foot-sep">·</span>
                  RECORDE <span id="menuBest">00000</span>
                </p>
              </section>

              <section class="screen" data-screen="options">
                <h2 class="heading">OPÇÕES</h2>
                <div class="option-list" id="optionList"></div>
                <button class="item item--back" data-nav data-action="back">
                  VOLTAR
                </button>
              </section>

              <section class="screen" data-screen="scores">
                <h2 class="heading">RECORDES</h2>
                <ul class="score-table" id="scoreTable"></ul>
                <div class="menu-list">
                  <button class="item item--danger" data-nav data-action="reset">
                    ZERAR RECORDES
                  </button>
                  <button class="item item--back" data-nav data-action="back">
                    VOLTAR
                  </button>
                </div>
              </section>

              <section class="screen" data-screen="pause">
                <h2 class="heading">PAUSADO</h2>
                <div class="menu-list">
                  <button class="item item--go" data-nav data-action="resume">
                    CONTINUAR
                  </button>
                  <button class="item" data-nav data-action="options">
                    OPÇÕES
                  </button>
                  <button class="item item--danger" data-nav data-action="quit">
                    SAIR PARA O MENU
                  </button>
                </div>
              </section>

              <section class="screen" data-screen="over">
                <h2 class="heading heading--danger">GAME OVER</h2>
                <p class="foot foot--big">
                  SCORE <span id="overScore">00000</span>
                </p>
                <p class="foot" id="overBestLine">
                  RECORDE <span id="overBest">00000</span>
                </p>
                <p class="badge" id="overBadge" hidden>NOVO RECORDE</p>
                <div class="menu-list">
                  <button class="item item--go" data-nav data-action="play">
                    JOGAR DE NOVO
                  </button>
                  <button class="item" data-nav data-action="quit">MENU</button>
                </div>
              </section>
            </div>
          </div>
        </div>

        <!-- só no desktop -->
        <footer id="hints">
          <span class="hint"><kbd>A</kbd><kbd>D</kbd> mover</span>
          <span class="hint-sep">·</span>
          <span class="hint"><kbd>ESPAÇO</kbd> atirar</span>
          <span class="hint-sep">·</span>
          <span class="hint"><kbd>ESC</kbd> pausar</span>
        </footer>
      </div>

      <!-- só no mobile -->
      <nav id="dock" aria-label="Controles">
        <div class="dock-move">
          <button id="buttonLeft" class="pad" type="button" aria-label="Mover para a esquerda">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4 7 12l8 8z" /></svg>
          </button>
          <button id="buttonRight" class="pad" type="button" aria-label="Mover para a direita">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4l8 8-8 8z" /></svg>
          </button>
        </div>
        <button id="buttonPause" class="pad pad--small" type="button" aria-label="Pausar">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="7" y="5" width="4" height="14" rx="1" />
            <rect x="13" y="5" width="4" height="14" rx="1" />
          </svg>
        </button>
        <button id="buttonAttack" class="pad pad--fire" type="button" aria-label="Atirar">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 2 7.5 8.5h9z" />
            <rect x="10.5" y="10" width="3" height="12" rx="1.5" />
          </svg>
        </button>
      </nav>

      <div id="rotate">
        <p>GIRE O APARELHO</p>
        <span>o jogo é em modo retrato</span>
      </div>
    </div>

    <script src="./settings.js"></script>
    <script src="./audio.js"></script>
    <script src="./menu.js"></script>
    <script src="./space.js"></script>
  </body>
</html>
